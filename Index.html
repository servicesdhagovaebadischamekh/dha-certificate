<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - DHA Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="verification-container">
        <!-- Header / Branding -->
        <header class="portal-header">
            <h2>Certificate Verification Portal</h2>
            <p class="subtitle">Dubai Health Authority</p>
        </header>

        <!-- Verification Status Card -->
        <main class="card">
            <div class="status-badge success">Verified & Valid</div>
            
            <div class="details-section">
                <div class="row">
                    <span class="label">Reference ID:</span>
                    <span class="value">7F114E78-2425-4C81-9A55-65086A816D2D</span>
                </div>
                <div class="row">
                    <span class="label">Document Type:</span>
                    <span class="value">Facility License Certificate</span>
                </div>
            </div>

            <!-- PDF Action Buttons -->
            <div class="action-buttons">
                <a href="assets/certificate.pdf" target="_blank" class="btn primary-btn">View Certificate PDF</a>
                <a href="assets/certificate.pdf" download="certificate.pdf" class="btn secondary-btn">Download PDF</a>
            </div>
        </main>
    </div>
</body>
</html>
